version: '3'

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=yourpassword   # Set your Redis password here
    command: [ "redis-server", "--requirepass", "kr2bFA4DcJPO8Y778duz8A","--appendonly", "yes", "--save", "60", "1" ]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    environment:
      - REDIS_1_HOST=redis
      - REDIS_1_PORT=6379
      - REDIS_1_NAME=LocalRedis
      - REDIS_1_PASSWORD=kr2bFA4DcJPO8Y778duz8A # Provide the Redis password for RedisInsight
    depends_on:
        - redis
    volumes:
      - redisinsight-data:/data  # Persist RedisInsight data in a Docker volume
    restart: unless-stopped
volumes:
  redis-data:
  redisinsight-data: