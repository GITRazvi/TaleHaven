services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=yourpassword   # Set your Redis password here
    command: [ "redis-server", "--requirepass", "kr2bFA4DcJPO8Y778duz8A","--appendonly", "yes", "--save", "60", "1" ]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    environment:
      - REDIS_1_HOST=redis
      - REDIS_1_PORT=6379
      - REDIS_1_NAME=LocalRedis
      - REDIS_1_PASSWORD=kr2bFA4DcJPO8Y778duz8A # Provide the Redis password for RedisInsight
    depends_on:
        - redis
    volumes:
      - redisinsight-data:/data  # Persist RedisInsight data in a Docker volume
    restart: unless-stopped

  talehaven-postgres:
    image: postgres:16-alpine
    container_name: talehaven-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=talehaven
      - POSTGRES_PASSWORD=talehaven123
      - POSTGRES_DB=talehaven
    volumes:
      - talehaven-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talehaven"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_HOST: redis:6379
      REDIS_PWD: kr2bFA4DcJPO8Y778duz8A
      DB_HOST: talehaven-postgres
      DB_PORT: 5432
      DB_USER: talehaven
      DB_PASSWORD: talehaven123
      DB_NAME: talehaven
      DB_SSLMODE: disable
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_started
      talehaven-postgres:
        condition: service_healthy
    volumes:
      - backend-images:/app/images
      - ./.env:/app/.env:ro
    restart: unless-stopped

  frontend:
    build:
      context: ../Front-End
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://localhost:3001
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  redisinsight-data:
  talehaven-postgres-data:
  backend-images:
